<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Live Submissions</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f4f7f6;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h2 {
            color: #0056b3;
        }
        .back-link {
            color: #0056b3;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #0056b3;
            color: white;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f5f9;
        }
        .refresh-status {
            font-size: 12px;
            color: #666;
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <a href="index.html" class="back-link">&larr; Back to Form</a>
        <span style="font-size: 13px; color: #28a745; font-weight: bold;">● Live Auto-Refreshing</span>
    </div>

    <h2>Admin Panel - Live Voter Submissions</h2>
    
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Mobile Number</th>
                    <th>EPIC Number</th>
                    <th>Last Updated Time</th>
                </tr>
            </thead>
            <tbody id="submissionTableBody">
                <!-- Data dynamically load hoga -->
            </tbody>
        </table>
    </div>
    
    <div class="refresh-status" id="refreshStatus">Refreshing live data every 2 seconds...</div>
</div>

<script>
    function loadData() {
        const tableBody = document.getElementById('submissionTableBody');
        const submissions = JSON.parse(localStorage.getItem('voterSubmissions')) || [];

        if (submissions.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: #777;">No submissions found yet.</td></tr>`;
        } else {
            tableBody.innerHTML = "";
            submissions.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.fullname}</td>
                    <td>${item.mobile}</td>
                    <td>${item.epic}</td>
                    <td>${item.time}</td>
                `;
                tableBody.appendChild(row);
            });
        }
    }

    // Page load hone par data load karein
    loadData();

    // Har 2 seconds me automatic table ko refresh karein
    setInterval(loadData, 2000);
</script>

</body>
</html>
